<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>5 Klockor – GitHub Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <button class="active" onclick="openTab(0)">Digital</button>
  <button onclick="openTab(1)">Analog</button>
  <button onclick="openTab(2)">Binary</button>
  <button onclick="openTab(3)">Stopwatch</button>
  <button onclick="openTab(4)">Alarm</button>
</nav>

<!-- Digital -->
<div class="tab active">
  <div class="digital-frame">
    <div id="digital" class="clock"></div>
  </div>
</div>

<!-- Analog -->
<div class="tab">
  <canvas id="analog" width="300" height="300"></canvas>
</div>

<!-- Binary -->
<div class="tab">
  <div id="binary" class="clock"></div>
</div>

<!-- Stopwatch -->
<div class="tab">
  <div id="stopwatch" class="clock">00:00:00</div>
  <button onclick="startSW()">Start</button>
  <button onclick="stopSW()">Stop</button>
  <button onclick="resetSW()">Reset</button>
</div>

<!-- Alarm -->
<div class="tab">
  <div class="digital-frame">
    <div id="alarmTime" class="clock">07:00</div>
  </div>

  <br><br>

  <input type="time" id="alarmInput" value="07:00">

  <br><br>

  <button onclick="setAlarm()">Sätt alarm</button>
  <button onclick="snooze()">Snooze 5 min</button>
  <button onclick="clearAlarm()">Stäng av</button>

  <div id="alarmStatus"></div>
</div>

<audio id="alarmSound" loop>
  <source src="alarm.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
