<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Clock Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <button class="active" onclick="openTab(0)">Digital</button>
  <button onclick="openTab(1)">Analog</button>
  <button onclick="openTab(2)">World</button>
  <button onclick="openTab(3)">Stopwatch</button>
  <button onclick="openTab(4)">Alarm</button>
  <button onclick="openTab(5)">Date</button>
  <button onclick="openTab(6)">Pomodoro</button>
  <button onclick="openTab(7)">UTC</button>
  <button onclick="openTab(8)">Flip</button>
  <button onclick="openTab(9)">Night</button>
</nav>

<div class="tab active"><div class="digital-frame"><div id="digital" class="clock"></div></div></div>

<div class="tab"><canvas id="analog" width="300" height="300"></canvas></div>

<div class="tab">
  <div class="digital-frame"><div id="wc-se" class="clock"></div></div><p>Sverige</p>
  <div class="digital-frame"><div id="wc-ny" class="clock"></div></div><p>New York</p>
  <div class="digital-frame"><div id="wc-tokyo" class="clock"></div></div><p>Tokyo</p>
</div>

<div class="tab">
  <div id="stopwatch" class="clock">00:00:00</div>
  <button onclick="startSW()">Start</button>
  <button onclick="stopSW()">Stop</button>
  <button onclick="resetSW()">Reset</button>
</div>

<div class="tab">
  <div class="digital-frame"><div id="alarmTime" class="clock">07:00</div></div>
  <input type="time" id="alarmInput" value="07:00">
  <button onclick="setAlarm()">Sätt</button>
  <button onclick="snooze()">Snooze</button>
  <button onclick="clearAlarm()">Av</button>
  <div id="alarmStatus"></div>
</div>

<div class="tab">
  <div id="dateClock" class="clock"></div>
</div>

<div class="tab">
  <div id="pomo" class="clock">25:00</div>
  <button onclick="startPomo()">Start</button>
  <button onclick="resetPomo()">Reset</button>
</div>

<div class="tab">
  <div id="utc" class="clock"></div>
  <div id="unix" class="clock"></div>
</div>

<div class="tab"><div id="flip" class="flip"></div></div>

<div class="tab night" onclick="toggleFull()"><div id="night" class="clock"></div></div>

<audio id="alarmSound" loop src="alarm.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
